<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 検索エンジンに載せない（URLを知っている人だけが見る想定） -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>ジョホールバル 内見マップ｜Johor Bahru Viewing Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; }
  #wrap { display:flex; flex-direction:column; height:100%; }
  header { background:#0f2c4c; color:#fff; padding:12px 18px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; font-size:13px; color:#bcd2e8; }
  #map { flex:1; }

  .legend {
    background:#fff; padding:8px 11px; line-height:1.65; font-size:11.5px;
    box-shadow:0 1px 6px rgba(0,0,0,.3); border-radius:6px; width:262px;
  }
  .legend > b:first-child { display:block; margin-bottom:5px; font-size:13px; color:#0f2c4c; }
  .legend .en { color:#888; font-weight:normal; font-size:11px; }
  .legend .dot { display:inline-block; width:13px; height:13px; border-radius:50%;
                 margin-right:7px; vertical-align:middle; border:2px solid #fff;
                 box-shadow:0 0 0 1px rgba(0,0,0,.35); }
  .legend .note { display:block; margin-top:7px; padding-top:6px; border-top:1px solid #eee;
                  font-size:11px; color:#777; line-height:1.6; }

  /* ピンポイント表示用の点 */
  .pin-dot {
    width:15px; height:15px; border-radius:50%;
    border:3px solid #fff; box-shadow:0 0 0 1.5px rgba(0,0,0,.45), 0 1px 4px rgba(0,0,0,.4);
  }
  .pin-dot.check { border-style:dashed; border-color:#fffbe8; }

  .tip-label {
    background:rgba(255,255,255,.94); border:1px solid #8a8a8a; border-radius:4px;
    padding:2px 6px; font-size:12px; font-weight:bold; white-space:nowrap;
    color:#222; line-height:1.35; text-align:center;
  }
  .tip-label .en { display:block; font-weight:normal; font-size:10.5px; color:#5a5a5a; }

  .tip-label.tip-group { background:rgba(15,44,76,.9); border-color:#0f2c4c; color:#fff; }
  .tip-label.tip-group .en { color:#c6d8ea; }

  .labeltoggle { background:#fff; padding:6px 9px; border-radius:5px; font-size:12px;
                 box-shadow:0 1px 5px rgba(0,0,0,.3); margin-top:8px; }
  .labeltoggle label { cursor:pointer; user-select:none; }
  .labeltoggle .hint { display:block; margin-top:3px; font-size:10.5px; color:#888; line-height:1.45; }

  .leaflet-popup-content { font-size:13px; line-height:1.6; }
  .leaflet-popup-content h3 { margin:0 0 2px; font-size:15px; }
  .leaflet-popup-content h3 .en { display:block; font-size:12px; color:#666; font-weight:normal; }
  .leaflet-popup-content .cat { color:#c0392b; font-weight:bold; }
  .leaflet-popup-content .warn { color:#b7791f; font-size:11.5px; }
  .leaflet-popup-content .src { color:#8a8a8a; font-size:10.5px; margin-top:5px;
                                border-top:1px dotted #ddd; padding-top:4px; }

  .legend summary { cursor:pointer; list-style:none; font-weight:bold; font-size:13px; color:#0f2c4c; }
  .legend summary::-webkit-details-marker { display:none; }
  .legend summary::after { content:" ▾"; color:#888; font-weight:normal; }
  .legend details[open] summary::after { content:" ▴"; }

  /* ---- スマホ（先方はスマホで開く想定）---- */
  @media (max-width: 640px) {
    header { padding:8px 12px; }
    header h1 { font-size:15px; }
    header p  { font-size:10.5px; margin-top:2px; }
    .legend { font-size:10.5px; padding:6px 9px; max-width:none; width:auto; line-height:1.5; }
    .legend summary { font-size:11.5px; }
    .legend .dot { width:10px; height:10px; margin-right:5px; }
    .legend .en { font-size:9.5px; }
    .legend .note { font-size:9.5px; margin-top:5px; padding-top:4px; }
    .labeltoggle { font-size:10.5px; padding:4px 7px; }
    .labeltoggle .hint { display:none; }
    .tip-label { font-size:10px; padding:1px 4px; }
    .tip-label .en { font-size:9px; }
    .leaflet-popup-content { font-size:12px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>ジョホールバル 内見マップ ／ Johor Bahru Viewing Map</h1>
    <p>ご希望いただいた物件の所在地です　／　ピンをクリックすると物件の特徴が出ます</p>
  </header>
  <div id="map"></div>
</div>

<script>
/* ============================================================
   座標はこの places 配列だけ直せば全部反映されます。
   出典：OpenStreetMap（Nominatim / Overpass）で建物・敷地を照合（2026-07-31 取得）
   check:true = 建物の同定が未確定（ピンの縁が破線になります）
   d = ラベルを出す向き（密集地でぶつからないよう指定）
   ============================================================ */

var COLOR = {
  nature: "#27ae60",  // 自然派・巨大ヴィラ
  water:  "#2980b9",  // 水辺派・ヴィラ
  urban:  "#c0392b",  // 都会派・超高層
  office: "#8e44ad",  // オフィス
  extra:  "#e67e22",  // 追加候補（カテゴリ未指定）
  other:  "#7f8c8d"   // その他
};

var CATNAME = {
  nature: ["自然派・巨大ヴィラ",        "Nature villa"],
  water:  ["水辺派・ヴィラ",            "Waterfront villa"],
  urban:  ["都会派・超高層",            "Urban high-rise"],
  office: ["オフィス",                  "Office"],
  extra:  ["追加候補",                  "Additional"],
  other:  ["その他",                    "Other"]
};

/* 密集していて全体表示では個別ラベルが入らないため、ズームで3段階に切り替える。
   各 place の zmin = その個別ラベルが出はじめるズーム。
     zmin 0  … 常に個別表示（離れている物件）
     zmin 12 … 全体表示ではイスカンダル・プテリのまとまりに含める
     zmin 14 … さらに密集（プテリハーバー4件・メディニ2件） */
var GROUPS = [
  { ja:"イスカンダル・プテリ 9件", en:"Iskandar Puteri (9)", lat:1.4236, lng:103.6384, d:"left",
    show:function(z){ return z < 12; } },
  { ja:"プテリハーバー 4件", en:"Puteri Harbour (4)", lat:1.41705, lng:103.65835, d:"right",
    show:function(z){ return z >= 12 && z < 14; } },
  { ja:"メディニ 2件", en:"Medini (2)", lat:1.41690, lng:103.62685, d:"top",
    show:function(z){ return z >= 12 && z < 14; } }
];

var places = [
  /* ---------- 自然派・巨大なヴィラ ---------- */
  { cat:"nature", lat:1.4077, lng:103.6109, check:false, d:"left", zmin:12,
    ja:"レジャー・ファーム", en:"Leisure Farm",
    addr:"Jalan Peranginan, Gelang Patah 81560",
    body:"<div>広大な敷地のリゾート型住宅地。自然環境を重視したヴィラ。</div>"+
         "<div style='color:#666'>A large resort-style residential estate with a natural setting.</div>" },

  { cat:"other", lat:1.3388, lng:103.5876, check:false, d:"bottom",
    ja:"フォレストシティ", en:"Forest City",
    addr:"Forest City, Kampung Tanjung Kupang, Iskandar Puteri 81550",
    body:"<div>高層レジデンスが建ち並ぶ埋立地の街。</div>"+
         "<div style='color:#666'>A reclaimed-island township lined with high-rise residences.</div>"+
         "<div class='warn'>※「Forest City」という名前の場所は2つあります。ここは<b>フォレストシティ本体</b>"+
         "（マンション群の中心）。<b>フォレストシティ ゴルフリゾート</b>は北北西へ<b>約9km</b>離れた別の場所です</div>" },

  /* ---------- 水辺派・ヴィラ ---------- */
  { cat:"water", lat:1.4261, lng:103.6637, check:false, d:"right", zmin:14,
    ja:"エメラルド・ベイ", en:"Emerald Bay",
    addr:"Puteri Harbour, Iskandar Puteri 79100",
    body:"<div>3階建ての<b>独立型ヴィラ（バンガロー）</b>。</div>"+
         "<div class='cat'>ヨットドック（ヨットを係留するデッキ）付きユニットあり</div>"+
         "<div style='color:#666'>3-storey detached bungalows. Units with a private yacht dock are available.</div>" },

  { cat:"water", lat:1.4641, lng:103.6267, check:false, d:"left", zmin:12,
    ja:"ホライゾン・ヒルズ", en:"Horizon Hills — The Peak",
    addr:"Horizon Hills, Pulai, Iskandar Puteri 79100",
    body:"<div>住宅スタイル：<b>「The Peak」「Mansion18」</b>といった区画のバンガロー（一戸建て）。</div>"+
         "<div style='color:#666'>Bungalow precincts such as The Peak and Mansion18.</div>"+
         "<div class='warn'>※ピンは <b>The Peak</b> 区画です。ホライゾン・ヒルズは486ヘクタール・11区画の大規模開発です。"+
         "<b>Mansion18 は別区画</b>で、公式サイトの表記から <b>The Woodlands 側（ここから東南東へ約0.6km）</b>と見られますが、"+
         "正確な位置は特定できていません。Mansion18 をご覧になる場合は別途ご確認ください</div>" },

  { cat:"water", lat:1.4114, lng:103.6555, check:false, d:"bottom", zmin:14,
    ja:"プテリ・コーブ", en:"Puteri Cove Residences",
    addr:"Persiaran Laksamana, Puteri Harbour 79100",
    body:"<div>プテリハーバーのコンドミニアム。</div>"+
         "<div class='cat'>ご希望：3LDK（160平米クラス）</div>"+
         "<div style='color:#666'>Condominium in Puteri Harbour. Requested: 3-bedroom (approx. 160 sqm).</div>" },

  { cat:"water", lat:1.4137, lng:103.6587, check:false, d:"right", zmin:14,
    ja:"サザン・マリーナ", en:"Southern Marina Residences",
    addr:"Persiaran Puteri Selatan, Puteri Harbour 79100",
    body:"<div>マリーナ沿いのレジデンス。</div>"+
         "<div style='color:#666'>A residence along the marina.</div>" },

  /* ---------- 都会派・超高層 ---------- */
  { cat:"urban", lat:1.4738, lng:103.7650, check:false, d:"bottom",
    ja:"アスタカ", en:"The Astaka @ One Bukit Senyum",
    addr:"Astaka Boulevard, One Bukit Senyum, JB 80300",
    body:"<div>JB中心部の超高層レジデンス。</div>"+
         "<div style='color:#666'>High-rise residence in central Johor Bahru.</div>" },

  { cat:"urban", lat:1.4776, lng:103.7603, check:false, d:"left",
    ja:"セティア・スカイ88", en:"Setia Sky 88",
    addr:"Johor Bahru",
    body:"<div>JB中心部の超高層レジデンス。</div>"+
         "<div style='color:#666'>High-rise residence in central Johor Bahru.</div>" },

  { cat:"urban", lat:1.4170, lng:103.6555, check:false, d:"top", zmin:14,
    ja:"インペリア", en:"Imperia",
    addr:"Puteri Harbour, Iskandar Puteri 79100",
    body:"<div>プテリハーバーのコンドミニアム。</div>"+
         "<div style='color:#666'>Condominium in Puteri Harbour.</div>" },

  /* ---------- オフィス ---------- */
  { cat:"office", lat:1.4125, lng:103.6277, check:false, d:"bottom", zmin:14,
    ja:"メディニ9", en:"Medini 9",
    addr:"Jalan Medini Sentral 5/2, Sunway Iskandar, Medini 79250",
    body:"<div>メディニ地区のスマートオフィス。</div>"+
         "<div class='cat'>ご希望面積：約100〜150㎡</div>"+
         "<div style='color:#666'>Smart office in Medini. Requested area: approx. 100–150 sqm.</div>" },

  { cat:"office", lat:1.4213, lng:103.6260, check:true, d:"top", zmin:14,
    ja:"UMCity（要確認）", en:"UMCity — to be confirmed",
    addr:"Lebuh Kota Iskandar, Medini 79250",
    body:"<div class='warn'><b>※建物の同定が未確定です。</b>メディニに「UUM Tower」という建物は確認できませんでした。"+
         "UUM＝Universiti Utara Malaysia のキャンパスはケダ州シントクと KL のみで、メディニ校はありません"+
         "（UUM の資料にある「UUM Tower」はケダ州ジトラの構想案でした）。</div>"+
         "<div>メディニのスマートオフィスビルとして最も近いのは <b>UMCity Premium Corporate Office Tower</b>"+
         "（UMCity Medini Lakeside 内のオフィスビル）。ピンはその位置に置いています。</div>"+
         "<div class='cat'>ご希望面積：約100〜150㎡</div>"+
         "<div style='color:#666'>The building could not be identified. No &quot;UUM Tower&quot; was found in Medini; "+
         "UMCity Premium Corporate Office Tower is the closest match. Please confirm the exact name.</div>" },

  /* ---------- 追加候補 ---------- */
  { cat:"extra", lat:1.5256, lng:103.7834, check:false, d:"right",
    ja:"モレック・パイン4", en:"Molek Pine 4",
    addr:"Taman Molek, Tebrau, Johor Bahru 80150",
    body:"<div>タマン・モレック地区のコンドミニアム。JB中心部の北東。</div>"+
         "<div style='color:#666'>Condominium in Taman Molek, north-east of central Johor Bahru.</div>" },

  { cat:"extra", lat:1.4468, lng:103.6196, check:false, d:"left", zmin:12,
    ja:"エコ・ボタニック（戸建てエリア）", en:"Eco Botanic — landed homes",
    addr:"Eco Botanic, Gelang Patah, Iskandar Puteri 79200",
    body:"<div>イスカンダル・プテリのタウンシップ。ピンは<b>戸建てが並ぶ街区</b>を指しています。</div>"+
         "<div style='color:#666'>A township in Iskandar Puteri. The pin marks the landed-housing precinct.</div>"+
         "<div class='src'>座標：戸建て239棟（床面積200〜600㎡・中央値246㎡）の重心。"+
         "Eco Botanic Club House から約82m</div>" }
];

var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'© OpenStreetMap contributors'
}).addTo(map);

function dotIcon(color, check){
  return L.divIcon({
    className:'',
    html:'<div class="pin-dot'+(check?' check':'')+'" style="background:'+color+'"></div>',
    iconSize:[21,21], iconAnchor:[10.5,10.5]
  });
}

var OFFSET = { left:[-12,0], right:[12,0], top:[0,-11], bottom:[0,11] };

var group = [], markers = [];
places.forEach(function(p){
  var m = L.marker([p.lat,p.lng], { icon:dotIcon(COLOR[p.cat], p.check) }).addTo(map);
  markers.push(m);
  m.bindPopup(
    "<h3>"+p.ja+"<span class='en'>"+p.en+"</span></h3>"+
    "<div style='color:#555'>"+p.addr+"</div>"+
    "<div style='color:"+COLOR[p.cat]+";font-size:11px;font-weight:bold'>"+
      CATNAME[p.cat][0]+" / "+CATNAME[p.cat][1]+"</div>"+
    "<hr style='margin:6px 0'>"+p.body
  );
  m.bindTooltip(p.ja+"<span class='en'>"+p.en+"</span>", {
    permanent:true, direction:p.d, className:'tip-label', offset:OFFSET[p.d]
  });
  group.push([p.lat,p.lng]);
});

/* まとまりのラベル（全体表示のとき、密集地の代わりに出す） */
var groupMarkers = GROUPS.map(function(g){
  var gm = L.marker([g.lat,g.lng], {
    icon: L.divIcon({className:'', html:'', iconSize:[0,0]}),
    interactive:false
  }).addTo(map);
  gm.bindTooltip(g.ja+"<span class='en'>"+g.en+"</span>", {
    permanent:true, direction:g.d, className:'tip-label tip-group', offset:OFFSET[g.d]
  });
  return gm;
});

/* ズームに応じて、個別ラベルとまとまりラベルを切り替える */
var labelsOn = true;
function updateLabels(){
  var z = map.getZoom();
  places.forEach(function(p,i){
    var show = labelsOn && z >= (p.zmin || 0);
    show ? markers[i].openTooltip() : markers[i].closeTooltip();
  });
  groupMarkers.forEach(function(gm,i){
    (labelsOn && GROUPS[i].show(z)) ? gm.openTooltip() : gm.closeTooltip();
  });
}
map.on('zoomend', updateLabels);

/* ラベルが重なって見づらいときは消せるようにする */
var toggle = L.control({position:'topleft'});
toggle.onAdd = function(){
  var d = L.DomUtil.create('div','labeltoggle');
  L.DomEvent.disableClickPropagation(d);
  d.innerHTML = "<label><input type='checkbox' checked> 名前を表示 / Show names</label>"+
                "<span class='hint'>拡大すると密集地の名前が出ます<br>Zoom in to see clustered names</span>";
  d.querySelector('input').addEventListener('change', function(e){
    labelsOn = e.target.checked;
    updateLabels();
  });
  return d;
};
toggle.addTo(map);

/* ---------- 凡例 ---------- */
var legendBox = null, legendTouched = false, legendAuto = null;

/* 画面幅に合わせて凡例を開閉する（スマホでは畳む）。
   ただし利用者が自分で開閉したあとは触らない。
   toggle イベントは非同期に飛ぶので、同期フラグではなく
   「こちらが設定した値と一致するか」で自動/手動を見分ける */
function syncLegend(){
  if (!legendBox || legendTouched) return;
  var want = window.innerWidth > 640;
  if (legendBox.open !== want) { legendAuto = want; legendBox.open = want; }
}

var legend = L.control({position:'bottomright'});
legend.onAdd = function(){
  var d = L.DomUtil.create('div','legend');
  L.DomEvent.disableClickPropagation(d);
  var rows = ["nature","water","urban","office","extra","other"].map(function(k){
    return "<span class='dot' style='background:"+COLOR[k]+"'></span>"+
           CATNAME[k][0]+" <span class='en'>/ "+CATNAME[k][1]+"</span>";
  }).join("<br>");
  /* スマホでは畳んでおく（開いたままだと画面の4割を占めるため） */
  d.innerHTML =
    "<details"+(window.innerWidth > 640 ? " open" : "")+">"+
      "<summary>ご希望カテゴリ <span class='en'>/ Category</span></summary>"+
      rows +
      "<span class='note'>縁が破線のピン＝場所の特定が未確定<br>"+
      "Dashed outline = location not yet confirmed</span>"+
    "</details>";
  legendBox = d.querySelector('details');
  legendAuto = legendBox.open;
  legendBox.addEventListener('toggle', function(){
    // こちらが設定した値と違う＝利用者が自分で開閉した。以後は自動調整しない
    if (legendBox.open !== legendAuto) legendTouched = true;
  });
  return d;
};
legend.addTo(map);

/* コンテナのサイズが確定してから全体表示にする（確定前だと最大ズームに張り付くため） */
function fitAll(){
  map.invalidateSize();
  var s = map.getSize();
  /* 余白は画面サイズに合わせる（狭い画面で固定値だと引きすぎるため） */
  /* ラベルは横に伸びるので、横の余白を厚めに取る（とくに狭い画面） */
  var padX = Math.max(20, Math.min(95, s.x * (s.x < 640 ? 0.17 : 0.12)));
  var padY = Math.max(16, Math.min(80, s.y * 0.09));
  /* animate:false は必須。fitAll は初期・load・resize で連続して呼ばれるため、
     アニメーション付きだと後の呼び出しが前のアニメーションに打ち消されて反映されない */
  map.fitBounds(group, { paddingTopLeft:[padX,padY], paddingBottomRight:[padX,padY],
                         maxZoom:15, animate:false });
  updateLabels();
  syncLegend();
}
fitAll();
window.addEventListener('load', fitAll);
window.addEventListener('resize', fitAll);
</script>
</body>
</html>
